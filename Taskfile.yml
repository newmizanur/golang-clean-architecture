version: "3"

vars:
  GOOSE_FLAGS: GOOSE_DRIVER=postgres GOOSE_DBSTRING="postgres://postgres:postgres@127.0.0.1:5432/db?sslmode=disable"

tasks:

  # ── Run ──────────────────────────────────────────────────────────────────────

  run:
    desc: Run the REST API (Echo) locally
    cmds:
      - go run ./cmd/web

  run:grpc:
    desc: Run the gRPC server (port 50051)
    cmds:
      - go run ./cmd/grpc

  # ── Build ─────────────────────────────────────────────────────────────────────

  build:
    desc: Build REST API binary → bin/web
    cmds:
      - go build -o bin/web ./cmd/web

  build:grpc:
    desc: Build gRPC server binary → bin/grpc
    cmds:
      - go build -o bin/grpc ./cmd/grpc

  build:all:
    desc: Build both server binaries
    cmds:
      - task: build
      - task: build:grpc

  build:amazon-linux:
    desc: Static build for Amazon Linux (linux/amd64) → bin/web-linux-amd64
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/web-linux-amd64 ./cmd/web

  # ── Test ──────────────────────────────────────────────────────────────────────

  test:
    desc: Run all tests - unit + integration (integration needs Postgres, see postgres:docker/goose:up)
    cmds:
      - go test -tags=integration ./internal/... -v

  test:unit:
    desc: Run unit tests only (mocked dependencies, no external services required)
    cmds:
      - go test ./internal/... -v

  test:cov:
    desc: Run unit tests and display a per-function coverage report
    cmds:
      - go test ./internal/... -coverprofile=coverage.out
      - go tool cover -func=coverage.out

  test:grpc:
    desc: Run gRPC server unit tests only
    cmds:
      - go test ./internal/delivery/grpc/... -v

  test:http:
    desc: Run HTTP controller unit tests only
    cmds:
      - go test ./internal/delivery/http/... -v

  # ── Codegen ───────────────────────────────────────────────────────────────────

  proto:gen:
    desc: Re-generate gRPC Go code from internal/delivery/grpc/proto/item.proto
    cmds:
      - |
        protoc \
          --go_out=internal/delivery/grpc/pb \
          --go_opt=paths=import \
          --go-grpc_out=internal/delivery/grpc/pb \
          --go-grpc_opt=paths=import \
          --proto_path=internal/delivery/grpc/proto \
          internal/delivery/grpc/proto/item.proto
      - |
        find internal/delivery/grpc/pb -name '*.go' \
          -not -path 'internal/delivery/grpc/pb/*.go' \
          -exec mv {} internal/delivery/grpc/pb/ \;
      - find internal/delivery/grpc/pb -mindepth 1 -type d -empty -delete

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:docker:
    desc: Start a local PostgreSQL container
    cmds:
      - docker run --name postgres -p 5432:5432
          -e POSTGRES_PASSWORD=postgres
          -e POSTGRES_USER=postgres
          -e POSTGRES_DB=db
          -d postgres:16

  tools:install:
    desc: Install CLI tools (goose, protoc-gen-go, protoc-gen-go-grpc)
    cmds:
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

  # ── Migrations ────────────────────────────────────────────────────────────────

  goose:up:
    desc: Apply all pending migrations
    cmds:
      - "{{.GOOSE_FLAGS}} goose -dir ./db/migrations up"

  goose:down:
    desc: Roll back one migration step
    cmds:
      - "{{.GOOSE_FLAGS}} goose -dir ./db/migrations down"

  goose:create:
    desc: "Create a new migration (usage: task goose:create -- create_table_foo)"
    cmds:
      - goose -dir ./db/migrations create "{{.CLI_ARGS}}" sql
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "NAME is required. Example: task goose:create -- create_table_foo"
