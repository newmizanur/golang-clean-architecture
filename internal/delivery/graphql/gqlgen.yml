schema:
  - internal/delivery/graphql/schema/*.graphqls

exec:
  filename: internal/delivery/graphql/graph/generated.go
  package: graph

model:
  filename: internal/delivery/graphql/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/delivery/graphql/resolver
  package: resolver
  filename_template: "{name}.resolvers.go"

autobind: []

models:
  Item:
    model: golang-clean-architecture/internal/delivery/graphql/graph/model.Item
  Currency:
    model: golang-clean-architecture/internal/delivery/graphql/graph/model.Currency
  ItemPage:
    model: golang-clean-architecture/internal/delivery/graphql/graph/model.ItemPage
  ListItemsInput:
    model: golang-clean-architecture/internal/delivery/graphql/graph/model.ListItemsInput
  CreateItemInput:
    model: golang-clean-architecture/internal/delivery/graphql/graph/model.CreateItemInput
